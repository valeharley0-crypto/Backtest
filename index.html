<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal de Trades</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#07090f;--line:#182033;--tx:#e9eefb;--mut:#7f8aa3;--b:#007BFF;--r:#FF073A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px 12px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--b),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--b);box-shadow:0 0 12px rgba(0,123,255,.35)}
button.pri{background:linear-gradient(90deg,var(--b),#3a5bff);border-color:var(--b);font-weight:600;box-shadow:0 0 14px rgba(0,123,255,.5)}
#ml{min-width:140px;text-align:center;font-weight:700;font-size:16px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.k small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.k b{font-size:20px;font-weight:800}
.bl{color:var(--b);text-shadow:0 0 10px rgba(0,123,255,.6)}
.rd{color:var(--r);text-shadow:0 0 10px rgba(255,7,58,.6)}
.rk{max-width:200px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 76px;gap:4px}
.dh{color:var(--mut);font-size:11px;text-align:center;padding:4px 0;text-transform:uppercase}
.c{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.c:hover{border-color:var(--b)}
.c.o{opacity:.25;pointer-events:none}
.n{font-size:12px;color:var(--mut);text-align:right}
.c.t .n span{background:var(--r);color:#fff;border-radius:50%;padding:1px 6px;box-shadow:0 0 10px var(--r)}
.ch{border-radius:8px;padding:4px 6px;font-size:12px;border:1px solid;display:flex;flex-direction:column;gap:1px;min-width:0}
.ch.g{background:rgba(0,123,255,.12);border-color:rgba(0,123,255,.6);box-shadow:0 0 8px rgba(0,123,255,.25)}
.ch.l{background:rgba(255,7,58,.12);border-color:rgba(255,7,58,.6);box-shadow:0 0 8px rgba(255,7,58,.25)}
.ch b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch em{font-style:normal;font-weight:800}
.g em{color:var(--b)}.l em{color:var(--r)}
.ch small{color:var(--mut);font-weight:400}
.bd{align-self:flex-start;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff}
.g .bd{background:var(--b)}.l .bd{background:var(--r)}
.ch a{color:var(--mut);font-size:10px;text-decoration:none}
.wk{background:#05070c;border:1px dashed var(--line);border-radius:10px;padding:6px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:center;text-align:center;gap:2px}
.wk b{font-size:14px}
.ft{color:var(--mut);font-size:11px;margin-top:14px}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20}
.ov[hidden]{display:none}
.md{width:100%;max-width:460px;background:#07090f;border:1px solid var(--b);border-radius:16px;padding:16px;box-shadow:0 0 30px rgba(0,123,255,.35),0 0 60px rgba(255,7,58,.15)}
.md h2{margin:0;font-size:17px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
input{font:inherit;font-size:16px;color:var(--tx);background:#000;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
input:focus{outline:none;border-color:var(--b);box-shadow:0 0 10px rgba(0,123,255,.5)}
.seg{display:flex;gap:6px;margin:6px 0 10px}.seg button{flex:1}
.seg button.on{border-color:var(--b);background:rgba(0,123,255,.18);box-shadow:0 0 12px rgba(0,123,255,.5)}
.seg button.on[data-r="SL"]{border-color:var(--r);background:rgba(255,7,58,.18);box-shadow:0 0 12px rgba(255,7,58,.5)}
.pv{margin:10px 0;padding:10px;border-radius:10px;background:#000;border:1px solid var(--line);font-size:13px;min-height:42px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#del{margin-right:auto;color:var(--r);border-color:rgba(255,7,58,.5)}
@media(max-width:640px){.cal{grid-template-columns:repeat(7,1fr) 48px;gap:2px}.c{min-height:64px;padding:3px}.ch{padding:2px 3px;font-size:10px}.ch b,.ch .bd,.ch a,.ch small{display:none}.wk{font-size:10px;padding:3px}.wk b{font-size:11px}.dh{font-size:9px}h1{font-size:18px}}
</style>
</head>
<body>
<div class="w">
<header>
<h1>JOURNAL DE TRADES</h1>
<div class="nav"><button id="pm">‹</button><span id="ml"></span><button id="nm">›</button><button id="td">Aujourd’hui</button><button id="add" class="pri">+ Trade</button></div>
</header>
<div class="sum" id="sum"></div>
<label class="rk">Risque par trade ($)<input id="rk" inputmode="decimal" placeholder="ex. 100"></label>
<div class="cal" id="cal"></div>
<p class="ft">R calculé : SL = −1R · TP1+BE = RR1 ÷ 2 · TP2 = (RR1 + RR2) ÷ 2 (2 positions à parts égales). Les trades sont enregistrés sur cet appareil.</p>
</div>

<div class="ov" id="ov" hidden><div class="md">
<h2 id="mt">Nouveau trade</h2>
<div class="fg">
<label>Date<input id="fd" type="date"></label>
<label>Paire<input id="fp" list="pairs" value="XAUUSD"></label>
<label>Entry<input id="fe" inputmode="decimal"></label>
<label>SL<input id="fs" inputmode="decimal"></label>
<label>TP1<input id="f1" inputmode="decimal"></label>
<label>TP2<input id="f2" inputmode="decimal"></label>
</div>
<div class="seg" id="seg"><button type="button" data-r="TP2">TP2</button><button type="button" data-r="BE">TP1+BE</button><button type="button" data-r="SL">SL</button></div>
<label>Lien capture<input id="fl" placeholder="https://www.tradingview.com/x/…"></label>
<div class="pv" id="pv"></div>
<div class="act"><button type="button" id="del">Supprimer</button><button type="button" id="cx">Annuler</button><button type="button" id="save" class="pri">Enregistrer</button></div>
</div></div>
<datalist id="pairs"><option value="XAUUSD"><option value="XAGUSD"><option value="BTCUSD"><option value="EURUSD"><option value="GBPUSD"><option value="USDJPY"><option value="NAS100"><option value="US30"></datalist>

<script>
const MO=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const LB={TP2:"TP2",BE:"TP1+BE",SL:"SL"};
const $=s=>document.querySelector(s);
let T=[],risk=0,cur=new Date(),editId=null,res="TP2",delArm=false;
cur=new Date(cur.getFullYear(),cur.getMonth(),1);
try{T=JSON.parse(localStorage.getItem("jt.trades")||"[]");risk=parseFloat(localStorage.getItem("jt.risk"))||0}catch(e){}
const store=()=>{try{localStorage.setItem("jt.trades",JSON.stringify(T));localStorage.setItem("jt.risk",risk)}catch(e){}};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fR=x=>{x=Math.round(x*100)/100;return(x>0?"+":"")+x+"R"};
const fD=x=>(x<0?"-":"+")+"$"+Math.abs(Math.round(x)).toLocaleString("en-US");

function calc(t){
  const e=t.entry,s=t.sl;
  if(e==null||s==null||e===s)return null;
  let a=t.tp1,b=t.tp2;
  if(a==null)a=b;if(b==null)b=a;
  if(a==null)return null;
  const dir=e>s?"BUY":"SELL",rk=Math.abs(e-s);
  const rr=x=>(dir==="BUY"?x-e:e-x)/rk;
  const rr1=rr(a),rr2=rr(b);
  if(rr1<=0||rr2<=0)return{err:"Un TP est du mauvais côté de l’entry."};
  const R=t.res==="SL"?-1:t.res==="BE"?rr1/2:(rr1+rr2)/2;
  return{dir,rk,rr1,rr2,R};
}

const chip=x=>{
  const t=x.t,c=x.c,g=c.R>0;
  const lk=/^https?:\/\//i.test(t.link||"")?`<a href="${esc(t.link)}" target="_blank" rel="noopener">↗ capture</a>`:"";
  return `<div class="ch ${g?"g":"l"}" data-id="${t.id}"><b>${esc(t.pair)}</b><em>${fR(c.R)}${risk?` <small>${fD(c.R*risk)}</small>`:""}</em><span class="bd">${LB[t.res]}</span>${lk}</div>`;
};

function render(){
  const y=cur.getFullYear(),m=cur.getMonth(),pre=y+"-"+String(m+1).padStart(2,"0");
  $("#ml").textContent=MO[m]+" "+y;
  const all=T.map(t=>({t,c:calc(t)})).filter(x=>x.c&&!x.c.err);
  const by={};all.forEach(x=>(by[x.t.date]=by[x.t.date]||[]).push(x));
  const M=all.filter(x=>x.t.date.startsWith(pre));
  const n=M.length,w=M.filter(x=>x.c.R>0).length,sum=M.reduce((a,x)=>a+x.c.R,0);
  const gp=M.filter(x=>x.c.R>0).reduce((a,x)=>a+x.c.R,0),gl=-M.filter(x=>x.c.R<0).reduce((a,x)=>a+x.c.R,0);
  const cnt=r=>M.filter(x=>x.t.res===r).length;
  const avg=n?M.reduce((a,x)=>a+x.c.rr2,0)/n:0;
  const K=(l,v,c="")=>`<div class="k"><small>${l}</small><b class="${c}">${v}</b></div>`;
  $("#sum").innerHTML=K("Trades",n)+K("Win rate",n?Math.round(w/n*100)+"%":"—","bl")+K("TP2",cnt("TP2"),"bl")+K("TP1+BE",cnt("BE"),"bl")+K("SL",cnt("SL"),"rd")+K("Total R",fR(sum),sum>=0?"bl":"rd")+K("RR moyen",n?"1:"+avg.toFixed(1):"—")+K("Profit factor",gl>0?(gp/gl).toFixed(2):gp>0?"∞":"—")+(risk?K("Total $",fD(sum*risk),sum>=0?"bl":"rd"):"");
  const off=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),wk=Math.ceil((off+days)/7),td=iso(new Date());
  let h=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam","Sem."].map(d=>`<div class="dh">${d}</div>`).join("");
  for(let r=0;r<wk;r++){
    let wr=0,wn=0;
    for(let d=0;d<7;d++){
      const dt=new Date(y,m,1-off+r*7+d),k=iso(dt),inM=dt.getMonth()===m,L=inM?(by[k]||[]):[];
      L.forEach(x=>{wr+=x.c.R;wn++});
      h+=`<div class="c${inM?"":" o"}${k===td?" t":""}" data-d="${k}"><div class="n"><span>${dt.getDate()}</span></div>${L.map(chip).join("")}</div>`;
    }
    h+=`<div class="wk"><span>S${r+1}</span>${wn?`<b class="${wr>=0?"bl":"rd"}">${fR(wr)}</b><span>${wn} trade${wn>1?"s":""}</span>`:"<span>—</span>"}</div>`;
  }
  $("#cal").innerHTML=h;
  $("#rk").value=risk||"";
}

function read(){return{date:$("#fd").value,pair:$("#fp").value.trim().toUpperCase()||"—",entry:num($("#fe").value),sl:num($("#fs").value),tp1:num($("#f1").value),tp2:num($("#f2").value),res,link:$("#fl").value.trim()}}
function pv(){
  const c=calc(read());
  $("#pv").innerHTML=!c?`<span style="color:var(--mut)">Entre Entry, SL et TP pour voir le RR.</span>`:c.err?`<span class="rd">${c.err}</span>`:`<b>${c.dir}</b> · Risque ${c.rk.toFixed(2)} · RR TP1 1:${c.rr1.toFixed(2)} · RR TP2 1:${c.rr2.toFixed(2)}<br>Résultat : <b class="${c.R>0?"bl":"rd"}">${fR(c.R)}</b>${risk?` (${fD(c.R*risk)})`:""}`;
}
function setRes(r){res=r;document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));pv()}
function openM(date,id){
  editId=id||null;delArm=false;
  const t=id?T.find(x=>x.id===id):null;
  $("#mt").textContent=t?"Modifier le trade":"Nouveau trade";
  $("#fd").value=t?t.date:(date||iso(new Date()));
  $("#fp").value=t?t.pair:"XAUUSD";
  [["#fe","entry"],["#fs","sl"],["#f1","tp1"],["#f2","tp2"]].forEach(([s,k])=>$(s).value=t&&t[k]!=null?t[k]:"");
  $("#fl").value=t?t.link||"":"";
  $("#del").hidden=!t;$("#del").textContent="Supprimer";
  $("#ov").hidden=false;
  setRes(t?t.res:"TP2");
}
const closeM=()=>{$("#ov").hidden=true};

$("#cal").onclick=e=>{
  if(e.target.closest("a"))return;
  const ch=e.target.closest(".ch");
  if(ch)return openM(null,ch.dataset.id);
  const c=e.target.closest(".c");
  if(c)openM(c.dataset.d);
};
$("#pm").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("#nm").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$("#td").onclick=()=>{const n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);render()};
$("#add").onclick=()=>openM(iso(new Date()));
$("#rk").onchange=e=>{risk=num(e.target.value)||0;store();render()};
document.querySelectorAll(".md input").forEach(i=>i.oninput=pv);
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>setRes(b.dataset.r));
$("#cx").onclick=closeM;
$("#ov").onclick=e=>{if(e.target.id==="ov")closeM()};
document.onkeydown=e=>{if(e.key==="Escape")closeM()};
$("#save").onclick=()=>{
  const t=read(),c=calc(t);
  if(!t.date||!c||c.err){pv();return}
  if(editId){const i=T.findIndex(x=>x.id===editId);T[i]=Object.assign({},t,{id:editId})}
  else T.push(Object.assign({},t,{id:Date.now().toString(36)}));
  store();closeM();
  cur=new Date(+t.date.slice(0,4),+t.date.slice(5,7)-1,1);render();
};
$("#del").onclick=()=>{
  if(!delArm){delArm=true;$("#del").textContent="Confirmer ?";return}
  T=T.filter(x=>x.id!==editId);store();closeM();render();
};
render();
</script>
</body>
</html>
