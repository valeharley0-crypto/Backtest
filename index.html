<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Ares Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0c0c10;--line:#1d1d26;--tx:#f4f4f6;--mu:#8a8a98;--blue:#007BFF;--red:#FF073A;--g:#22c55e;--serif:"Playfair Display",Georgia,"Times New Roman",serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:640px;margin-inline:auto;background-image:radial-gradient(circle at 100% 0,#007bff22,transparent 45%),radial-gradient(circle at 0 100%,#ff073a1c,transparent 45%);background-attachment:fixed}
h1{font:900 34px/1 var(--serif);margin:6px 0 4px;letter-spacing:-.5px}
h1 span{color:var(--blue)}
.bar{width:44px;height:3px;background:var(--red);border-radius:2px;margin-bottom:14px;box-shadow:0 0 10px var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:14px;font:800 14px var(--serif);letter-spacing:.5px}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 16px #007bff66}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font:800 16px var(--serif);margin:0 0 10px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ring{text-align:center}
.ring svg{width:100%;max-width:76px;height:auto}
.ring .l{font-size:11px;color:var(--mu);margin-top:2px;text-transform:uppercase;letter-spacing:.6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st{background:#000;border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.st b{display:block;font-size:16px}.st span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.pos{color:var(--g)}.neg{color:var(--red)}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:10px;color:var(--mu);display:block;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--tx);font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.full{grid-column:1/-1}
.add{padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:800 15px var(--serif);box-shadow:0 0 16px #007bff55}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:400px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:10px;text-transform:uppercase}
.x{background:none;border:0;color:var(--red);font-size:16px}
.hide{display:none}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
.TP{background:#22c55e22;color:var(--g)}.SL{background:#ff073a22;color:var(--red)}.BE{background:#8a8a9833;color:var(--mu)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--tx);font-size:16px}
.nav b{font:800 18px var(--serif)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-size:10px;color:var(--mu);padding:2px 0}
.c{min-height:58px;border-radius:10px;border:1px solid var(--line);background:#000;padding:4px 2px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;color:var(--tx);font-family:inherit}
.c i{font-style:normal;font-size:10px;color:var(--mu);text-align:left;padding-left:3px}
.c strong{font-size:11px;line-height:1.1}
.c small{font-size:9px;opacity:.85}
.c.w{background:#22c55e26;border-color:var(--g)}.c.w strong{color:var(--g)}
.c.l{background:#ff073a26;border-color:var(--red)}.c.l strong{color:var(--red)}
.c.f{background:#8a8a9822}
.c.sel{box-shadow:0 0 0 2px var(--blue)}
.c.z{border-color:transparent;background:transparent}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.eq{width:100%;height:110px;display:block}
.sm{font-size:12px;color:var(--mu);margin-top:6px}
.fl{display:flex;gap:8px;margin-bottom:8px}
.fl select{padding:8px;font-size:13px}
.btn2{padding:10px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--tx);font-weight:700;font-size:13px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.note td{font-size:12px;color:var(--mu);white-space:normal;text-align:left;padding-top:0}
.ed{background:none;border:0;color:var(--blue);font-size:15px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<h1>GOLD <span>ARES</span></h1>
<div class="bar"></div>

<div class="tabs">
  <button id="tb-bt" class="on">📊 BACKTEST</button>
  <button id="tb-live">🔴 TRADE LIVE</button>
</div>

<div class="card">
  <div class="rings" id="rings"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="card">
  <h2>Equity curve (R)</h2>
  <svg class="eq" id="eq" viewBox="0 0 300 110" preserveAspectRatio="none"></svg>
  <div class="stats" id="stats2"></div>
</div>

<div class="card">
  <h2>Statistika isaky ny paire sy sens</h2>
  <div class="scroll"><table id="gt" style="min-width:0"></table></div>
</div>

<div class="card" id="cmp"></div>

<div class="card">
  <h2 id="ftitle">Trade vaovao</h2>
  <form id="f">
    <div><label>Daty</label><input type="date" id="d" required></div>
    <div><label>Paire</label><input id="p" value="XAUUSD" required></div>
    <div><label>Sens</label><select id="s"><option>BUY</option><option>SELL</option></select></div>
    <div><label>Valiny</label><select id="r"><option>TP</option><option>SL</option><option>BE</option></select></div>
    <div><label>Entry (prix)</label><input type="number" step="any" id="e" inputmode="decimal" required></div>
    <div><label>SL (prix)</label><input type="number" step="any" id="sl" inputmode="decimal" required></div>
    <div><label>TP (prix)</label><input type="number" step="any" id="tp" inputmode="decimal" required></div>
    <div class="lv"><label>Lot</label><input type="number" step="any" id="lot" inputmode="decimal"></div>
    <div class="lv full"><label>Gain / Perte ($) · ohatra 25 na -10</label><input type="number" step="any" id="g" inputmode="decimal"></div>
    <div class="full"><label>Note (tsy voatery)</label><input id="nt" placeholder="ohatra: OB + FVG"></div>
    <button class="add full" type="submit" id="sb">+ AMPIANA</button>
    <button class="btn2 full hide" type="button" id="cn">Foano ny fanovana</button>
  </form>
</div>

<div class="card hide" id="mcard">
  <div class="nav"><button id="pm">◀</button><b id="mname"></b><button id="nm">▶</button></div>
  <div class="cal" id="cal"></div>
  <div class="sum" id="msum"></div>
  <div style="margin-top:12px"><label>Tanjona volana ($)</label><input type="number" id="goal" inputmode="decimal" placeholder="ohatra 500"><div class="prog"><i id="gp" style="width:0"></i></div><div class="sm" id="gtx"></div></div>
</div>

<div class="card hide" id="dcard">
  <h2 id="dtitle"></h2>
  <div class="scroll"><table id="dt"></table></div>
</div>

<div class="card">
  <h2>Lisitry ny trade</h2>
  <div class="fl"><select id="fp"><option value="">Paire rehetra</option></select><select id="fr"><option value="">Valiny rehetra</option><option>TP</option><option>SL</option><option>BE</option></select></div>
  <div class="scroll"><table id="lt"></table></div>
</div>

<div class="card">
  <h2>Backup</h2>
  <div class="fl"><button class="btn2" id="ex" style="flex:1">⬇ Export JSON</button><button class="btn2" id="im" style="flex:1">⬆ Import JSON</button></div>
  <input type="file" id="fi" accept=".json,application/json" class="hide">
  <div class="sm">Manaova backup matetika mba tsy ho very ny angona raha fafana ny cache.</div>
</div>

<script>
var KEY="goldares_tracker_v1",mode="bt",S={bt:[],live:[]},sel=null;
try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var MN=["Janoary","Febroary","Martsa","Aprily","Mey","Jona","Jolay","Aogositra","Septambra","Oktobra","Novambra","Desambra"];
function calc(t){var k=Math.abs(t.e-t.sl),rr=k?Math.abs(t.tp-t.e)/k:0;return{rr:rr,r:t.res==="TP"?rr:(t.res==="SL"?-1:0)}}
function f2(n){return (Math.round(n*100)/100).toString()}
function cls(n){return n>0?"pos":(n<0?"neg":"")}
function sg(n){return (n>0?"+":"")+f2(n)}
function ring(label,pct,color,txt){
  var R=30,C=2*Math.PI*R,o=C*(1-Math.min(Math.max(pct,0),100)/100);
  return '<div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="'+R+'" fill="none" stroke="#1d1d26" stroke-width="8"/>'+
  '<circle cx="40" cy="40" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+o+'" transform="rotate(-90 40 40)" style="filter:drop-shadow(0 0 3px '+color+')"/>'+
  '<text x="40" y="45" text-anchor="middle" font-size="15" font-weight="800" fill="#f4f4f6">'+txt+'</text></svg><div class="l">'+label+'</div></div>'}
function tradeRow(t,i,withDel){
  var c=calc(t);
  return '<tr><td>'+t.d.slice(5)+'</td><td>'+t.p+'</td><td>'+t.s+'</td><td><span class="tag '+t.res+'">'+t.res+'</span></td><td>'+f2(c.rr)+'</td><td class="'+cls(c.r)+'">'+f2(c.r)+'</td>'+
  (mode==="live"?'<td>'+(t.lot||"-")+'</td><td class="'+cls(+t.g)+'">'+(t.g!==""&&t.g!=null?sg(+t.g):"-")+'</td>':'')+
  (withDel?'<td><button class="ed" data-e="'+i+'">✎</button><button class="x" data-i="'+i+'">✕</button></td>':'')+'</tr>'+(t.nt?'<tr class="note"><td colspan="9">📝 '+esc(t.nt)+'</td></tr>':'')}
function head(withDel){return '<tr><th>Daty</th><th>Paire</th><th>Sens</th><th>Valiny</th><th>RR</th><th>R</th>'+(mode==="live"?'<th>Lot</th><th>$</th>':'')+(withDel?'<th></th>':'')+'</tr>'}
function render(){
  var a=S[mode],n=a.length,tp=0,sl=0,be=0,R=0,RR=0,gain=0,lot=0;
  a.forEach(function(t){var c=calc(t);if(t.res==="TP")tp++;else if(t.res==="SL")sl++;else be++;R+=c.r;RR+=c.rr;gain+=+t.g||0;lot+=+t.lot||0});
  var wr=n?tp/n*100:0;
  $("rings").innerHTML=ring("Win rate",wr,"#007BFF",Math.round(wr)+"%")+ring("TP",n?tp/n*100:0,"#22c55e",tp)+ring("SL",n?sl/n*100:0,"#FF073A",sl)+ring("Trade",n?100:0,"#8a8a98",n);
  var st='<div class="st"><b class="'+cls(R)+'">'+sg(R)+'R</b><span>R total</span></div>'+
  '<div class="st"><b>'+f2(RR)+'</b><span>RR total</span></div>'+
  '<div class="st"><b>'+f2(n?RR/n:0)+'</b><span>RR moyen</span></div>';
  if(mode==="live")st+='<div class="st"><b class="'+cls(gain)+'">'+sg(gain)+'$</b><span>Gain total</span></div><div class="st"><b>'+f2(lot)+'</b><span>Lot total</span></div><div class="st"><b>'+be+'</b><span>Break-even</span></div>';
  $("stats").innerHTML=st;extras(a);
  var h=head(true);
  a.map(function(t,i){return{t:t,i:i}}).filter(function(o){return (!$("fp").value||o.t.p===$("fp").value)&&(!$("fr").value||o.t.res===$("fr").value)}).sort(function(x,y){return x.t.d<y.t.d?1:-1}).forEach(function(o){h+=tradeRow(o.t,o.i,true)});
  if(!n)h+='<tr><td colspan="9" style="text-align:center;color:var(--mu)">Mbola tsy misy trade</td></tr>';
  $("lt").innerHTML=h;
  $("lt").querySelectorAll(".ed").forEach(function(b){b.onclick=function(){startEdit(+b.dataset.e)}});
  $("lt").querySelectorAll(".x").forEach(function(b){b.onclick=function(){if(confirm("Fafana ve ity trade ity?")){S[mode].splice(+b.dataset.i,1);save();render()}}});
  if(mode==="live"){renderCal();renderDay()}
}
var now=new Date(),cy=now.getFullYear(),cmo=now.getMonth()+1;
function pad(n){return String(n).padStart(2,"0")}
function renderCal(){
  var ym=cy+"-"+pad(cmo),days={};
  $("mname").textContent=MN[cmo-1]+" "+cy;
  S.live.filter(function(t){return t.d.slice(0,7)===ym}).forEach(function(t){
    var o=days[t.d]||(days[t.d]={n:0,lot:0,g:0,r:0});o.n++;o.lot+=+t.lot||0;o.g+=+t.g||0;o.r+=calc(t).r});
  var off=(new Date(cy,cmo-1,1).getDay()+6)%7,dim=new Date(cy,cmo,0).getDate();
  var h=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(function(x){return '<div class="dn">'+x+'</div>'}).join("");
  for(var i=0;i<off;i++)h+='<div class="c z"></div>';
  var T={n:0,lot:0,g:0,r:0,w:0,l:0};
  for(var d=1;d<=dim;d++){
    var key=ym+"-"+pad(d),o=days[key],c="c";
    if(o){T.n+=o.n;T.lot+=o.lot;T.g+=o.g;T.r+=o.r;c+=o.g>0?" w":(o.g<0?" l":" f");if(o.g>0)T.w++;if(o.g<0)T.l++}
    if(sel===key)c+=" sel";
    h+='<button class="'+c+'" data-k="'+key+'"><i>'+d+'</i>'+(o?'<strong>'+sg(o.g)+'$</strong><small>'+o.n+' trade'+(o.n>1?'s':'')+'</small>':'<span></span>')+'</button>'}
  $("cal").innerHTML=h;
  $("cal").querySelectorAll("button.c").forEach(function(b){b.onclick=function(){sel=(sel===b.dataset.k)?null:b.dataset.k;renderCal();renderDay()}});
  $("msum").innerHTML='<div class="st"><b class="'+cls(T.g)+'">'+sg(T.g)+'$</b><span>Gain volana</span></div>'+
   '<div class="st"><b>'+T.n+'</b><span>Nombre de trade</span></div>'+
   '<div class="st"><b class="'+cls(T.r)+'">'+sg(T.r)+'R</b><span>R volana</span></div>'+
   '<div class="st"><b>'+f2(T.lot)+'</b><span>Lot total</span></div>'+
   '<div class="st"><b class="pos">'+T.w+'</b><span>Andro maintso</span></div>'+
   '<div class="st"><b class="neg">'+T.l+'</b><span>Andro mena</span></div>';
}
function renderDay(){
  if(!sel||mode!=="live"){$("dcard").classList.add("hide");return}
  var list=S.live.filter(function(t){return t.d===sel});
  $("dcard").classList.remove("hide");
  $("dtitle").textContent="Trade tamin’ny "+sel.slice(8)+" "+MN[+sel.slice(5,7)-1];
  var h=head(false);list.forEach(function(t){h+=tradeRow(t,0,false)});
  if(!list.length)h+='<tr><td colspan="8" style="text-align:center;color:var(--mu)">Tsy misy trade</td></tr>';
  $("dt").innerHTML=h;
}
$("pm").onclick=function(){cmo--;if(cmo<1){cmo=12;cy--}sel=null;renderCal();renderDay()};
$("nm").onclick=function(){cmo++;if(cmo>12){cmo=1;cy++}sel=null;renderCal();renderDay()};
function setMode(m){
  resetEdit();mode=m;$("tb-bt").className=m==="bt"?"on":"";$("tb-live").className=m==="live"?"on":"";
  document.querySelectorAll(".lv").forEach(function(e){e.classList.toggle("hide",m!=="live")});
  $("mcard").classList.toggle("hide",m!=="live");
  $("ftitle").textContent=m==="bt"?"Trade backtest vaovao":"Trade live vaovao";
  render();
}
$("tb-bt").onclick=function(){setMode("bt")};
$("tb-live").onclick=function(){setMode("live")};
$("d").value=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
$("f").onsubmit=function(ev){
  ev.preventDefault();
  var t={d:$("d").value,p:$("p").value.toUpperCase(),s:$("s").value,res:$("r").value,e:+$("e").value,sl:+$("sl").value,tp:+$("tp").value,nt:$("nt").value.trim()};
  if(mode==="live"){t.lot=$("lot").value;t.g=$("g").value;cy=+t.d.slice(0,4);cmo=+t.d.slice(5,7)}
  if(editIdx!==null&&S[mode][editIdx])S[mode][editIdx]=t;else S[mode].push(t);
  save();resetEdit();
  render();
};
S.goal=S.goal||{};
var editIdx=null;
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function resetEdit(){editIdx=null;["e","sl","tp","lot","g","nt"].forEach(function(i){$(i).value=""});$("sb").textContent="+ AMPIANA";$("cn").classList.add("hide")}
function startEdit(i){
  var t=S[mode][i];if(!t)return;editIdx=i;
  $("d").value=t.d;$("p").value=t.p;$("s").value=t.s;$("r").value=t.res;$("e").value=t.e;$("sl").value=t.sl;$("tp").value=t.tp;
  $("lot").value=t.lot||"";$("g").value=(t.g==null?"":t.g);$("nt").value=t.nt||"";
  $("sb").textContent="✔ ENREGISTRER";$("cn").classList.remove("hide");$("f").scrollIntoView({behavior:"smooth"});
}
$("cn").onclick=resetEdit;
$("fp").onchange=render;$("fr").onchange=render;
function bx(v,l,c){return '<div class="st"><b class="'+(c||"")+'">'+v+'</b><span>'+l+'</span></div>'}
function extras(a){
  var s=a.slice().sort(function(x,y){return x.d<y.d?-1:(x.d>y.d?1:0)}),cum=0,pk=0,dd=0,pos=0,neg=0,ws=0,ls=0,mw=0,ml=0,best=0,pts=[0];
  s.forEach(function(t){var r=calc(t).r;cum+=r;pts.push(cum);if(cum>pk)pk=cum;if(pk-cum>dd)dd=pk-cum;if(r>0)pos+=r;if(r<0)neg-=r;if(r>best)best=r;
    if(t.res==="TP"){ws++;ls=0;if(ws>mw)mw=ws}else if(t.res==="SL"){ls++;ws=0;if(ls>ml)ml=ls}});
  var W=300,H=110,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);if(mx===mn)mx=mn+1;
  var Y=function(v){return H-8-(v-mn)/(mx-mn)*(H-16)};
  var path=pts.map(function(v,i){return (i?"L":"M")+(pts.length>1?i/(pts.length-1)*W:0).toFixed(1)+" "+Y(v).toFixed(1)}).join(" ");
  $("eq").innerHTML='<line x1="0" x2="'+W+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#8a8a98" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>'+(s.length?'<path d="'+path+'" fill="none" stroke="#007BFF" stroke-width="2.5" vector-effect="non-scaling-stroke"/>':'');
  var n=a.length,pf=neg?f2(pos/neg):(pos?"∞":"0");
  $("stats2").innerHTML=bx(pf,"Profit factor")+bx(dd?"-"+f2(dd)+"R":"0R","Drawdown max","neg")+bx(sg(n?cum/n:0)+"R","R / trade",cls(cum))+bx(mw,"Streak TP max","pos")+bx(ml,"Streak SL max","neg")+bx(sg(best)+"R","Meilleur trade","pos");
  var G={};a.forEach(function(t){[t.p,t.s].forEach(function(k){var o=G[k]||(G[k]={n:0,w:0,r:0});o.n++;if(t.res==="TP")o.w++;o.r+=calc(t).r})});
  var gh='<tr><th>Groupe</th><th>Trade</th><th>Win %</th><th>R</th></tr>';
  Object.keys(G).sort().forEach(function(k){var o=G[k];gh+='<tr><td>'+esc(k)+'</td><td>'+o.n+'</td><td>'+Math.round(o.w/o.n*100)+'%</td><td class="'+cls(o.r)+'">'+sg(o.r)+'</td></tr>'});
  if(!n)gh+='<tr><td colspan="4" style="text-align:center;color:var(--mu)">Mbola tsy misy angona</td></tr>';
  $("gt").innerHTML=gh;
  var fp=$("fp"),cur=fp.value,seen={},ps=[];a.forEach(function(t){if(!seen[t.p]){seen[t.p]=1;ps.push(t.p)}});
  fp.innerHTML='<option value="">Paire rehetra</option>'+ps.sort().map(function(x){return '<option>'+esc(x)+'</option>'}).join("");fp.value=cur;
  cmpRender();
}
function cmpRender(){
  function st(a){var n=a.length,tp=0,R=0,RR=0;a.forEach(function(t){var c=calc(t);if(t.res==="TP")tp++;R+=c.r;RR+=c.rr});return{n:n,wr:n?tp/n*100:0,rr:n?RR/n:0,e:n?R/n:0}}
  function col(nm,x){return '<div class="st"><span>'+nm+'</span><b>'+Math.round(x.wr)+'%</b><span>Win rate</span><b>'+f2(x.rr)+'</b><span>RR moyen</span><b class="'+cls(x.e)+'">'+sg(x.e)+'R</b><span>R / trade</span><b>'+x.n+'</b><span>Trade</span></div>'}
  $("cmp").innerHTML='<h2>Backtest vs Live</h2><div class="cmp">'+col("BACKTEST",st(S.bt))+col("LIVE",st(S.live))+'</div>';
}
function goalRender(){
  var ym=cy+"-"+pad(cmo),g=+S.goal[ym]||0,gain=0;
  S.live.forEach(function(t){if(t.d.slice(0,7)===ym)gain+=+t.g||0});
  var pct=g>0?Math.min(100,Math.max(0,gain/g*100)):0;
  $("goal").value=g||"";$("gp").style.width=pct+"%";
  $("gtx").textContent=g>0?sg(gain)+"$ / "+g+"$ ("+Math.round(pct)+"%)":"Apetaho ny tanjona isam-bolana";
}
var _rc=renderCal;renderCal=function(){_rc();goalRender()};
$("goal").onchange=function(){S.goal[cy+"-"+pad(cmo)]=+$("goal").value||0;save();goalRender()};
$("ex").onclick=function(){
  var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="gold-ares-backup-"+$("d").value+".json";document.body.appendChild(a);a.click();a.remove();
};
$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(){
  var f=$("fi").files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);
    if(Array.isArray(o.bt)&&Array.isArray(o.live)){if(confirm("Hosoloina ny angona rehetra amin’ity backup ity?")){S={bt:o.bt,live:o.live,goal:o.goal||{}};save();render()}}
    else alert("Tsy backup Gold Ares ity fichier ity.")}catch(e){alert("Fichier tsy mety.")}$("fi").value=""};
  r.readAsText(f);
};
setMode("bt");
</script>
